<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        p
        {
            font-family: Aptos;
        }

        u
        {
            text-decoration: underline overline solid;
        }
    </style>
    <title>HTML Page</title>
</head>
<body>
    <p>Hello, World!</p>
    <p>You can use the mark tag to <mark>highlight</mark> text.</p>
    <p><u>This line of text will render as underlined.</u></p>
</body>
</html>
